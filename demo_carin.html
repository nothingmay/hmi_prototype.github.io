<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Robotaxi · Cabin Demo</title>
  <style>
    :root {
      --bg: #f1f5fa;
      --line: #bfd2e5;
      --text: #102539;
      --muted: #6b849c;
      --blue: #1668d4;
      --blue-bg: #e1ecfa;
      --safe: #0b8a72;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Arial, sans-serif;
      background:
        radial-gradient(circle at 0% 0%, rgba(22,104,212,0.08), transparent 35%),
        radial-gradient(circle at 100% 100%, rgba(11,138,114,0.06), transparent 35%),
        #dce8f5;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .deck {
      width: 100%; height: 100%;
      padding: 12px;
      display: grid;
      grid-template-rows: 56px 1fr 96px;
      gap: 12px;
    }
    .deck-topbar {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,0.95);
      display: flex; align-items: center;
      padding: 0 18px; gap: 14px;
      box-shadow: 0 2px 8px rgba(16,37,57,0.08);
    }
    .deck-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 6px;
      background: #0f2438; color: #fff;
      font-size: 11px; font-weight: 800; letter-spacing: 0.04em;
    }
    .deck-title { font-size: 16px; font-weight: 900; color: #102539; }
    .stage {
      min-height: 0; border: 1px solid var(--line);
      border-radius: 14px; overflow: hidden;
      background: #f5f9fd;
      box-shadow: 0 4px 16px rgba(16,37,57,0.08);
      display: flex; flex-direction: column;
    }
    .stage-hd {
      height: 40px; flex-shrink: 0;
      border-bottom: 1px solid var(--line);
      padding: 0 14px; display: flex;
      align-items: center; justify-content: space-between;
      font-size: 11px; font-weight: 900; letter-spacing: 0.08em;
      text-transform: uppercase; color: #5f7a93;
      background: rgba(255,255,255,0.85);
    }
    .stage-hd .l { color: #102539; letter-spacing: 0.08em; }
    .sc-badge {
      padding: 3px 10px; border-radius: 6px;
      background: #1668d4; color: #fff;
      font-size: 10px; font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: none;
      transition: background 0.3s;
      max-width: 42vw; overflow: hidden;
      white-space: nowrap; text-overflow: ellipsis;
    }
    .sc-badge.risk-high { background: #c0202e; }
    .sc-badge.risk-low { background: #0b8a72; }
    .sc-badge.risk-med { background: #b85c00; }

    .stage-vp {
      position: relative; flex: 1; width: 100%;
      overflow: hidden; background: #d8e8f4;
    }
    .scale-wrap {
      position: absolute; top: 0; left: 0;
      transform-origin: top left;
    }
    iframe { border: none; display: block; }

    .scenario-strip {
      border: 1px solid var(--line); border-radius: 14px;
      background: rgba(255,255,255,0.95);
      display: flex; align-items: center; gap: 8px;
      padding: 12px 14px; overflow-x: auto;
      box-shadow: 0 2px 8px rgba(16,37,57,0.06);
      scrollbar-width: thin;
    }
    .scenario-strip::-webkit-scrollbar { height: 4px; }
    .scenario-strip::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }
    .strip-label {
      flex-shrink: 0; font-size: 10px; font-weight: 900;
      letter-spacing: 0.1em; color: #6b849c;
      text-transform: uppercase; margin-right: 4px;
    }
    .s-btn {
      flex-shrink: 0; min-height: 60px;
      padding: 8px 14px; border-radius: 10px;
      border: 1.5px solid #bcd1e5; background: #f3f8fe;
      color: #22384d; font-size: 13px; font-weight: 900;
      line-height: 1.2; cursor: pointer; transition: all 0.15s;
      font-family: inherit; text-align: left;
    }
    .s-btn small {
      display: block; font-size: 10px; font-weight: 700; color: #6b849c;
      margin-top: 3px; letter-spacing: 0;
    }
    .s-btn:hover {
      background: #e8f2fc; border-color: #8eb5da; transform: translateY(-1px);
      box-shadow: 0 4px 8px rgba(16,37,57,0.08);
    }
    .s-btn.active { background: #d8ebff; border-color: #5f9dd9; color: #124e88; }

    .back-home {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.9);
      color: #36506b;
      font-size: 12px;
      font-weight: 800;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .back-home:hover {
      background: var(--blue-bg);
      border-color: #7eb0ec;
      color: var(--blue);
    }
  </style>
</head>
<body>

<div class="deck">
  <div class="deck-topbar">
    <a class="back-home" href="index.html">← Home</a>
    <div class="deck-badge">DEMO</div>
    <div>
      <div class="deck-title">Robotaxi HMI · Cabin Display</div>
      <div class="deck-sub" id="deckSub">Manual mode · choose a scenario below</div>
    </div>
  </div>

  <section class="stage">
    <div class="stage-hd">
      <span class="l">Cabin Display · 1280 × 720</span>
      <span class="sc-badge risk-med" id="scBadge">🔄 Reset</span>
    </div>
    <div class="stage-vp" id="cabinVP">
      <div class="scale-wrap" id="cabinWrap">
        <iframe src="./cabin_ui.html" width="1280" height="720" title="Cabin UI preview"></iframe>
      </div>
    </div>
  </section>

  <div class="scenario-strip">
    <div class="strip-label">Scenarios</div>
    <button class="s-btn" id="btn-reset"      onclick="manualTrigger('reset')">🔄 Reset<small>Initial baseline</small></button>
    <button class="s-btn" id="btn-ext_signal" onclick="manualTrigger('ext_signal')">🚦 Signal Anomaly<small>Pre-intersection hold · Med</small></button>
    <button class="s-btn" id="btn-ext_env"    onclick="manualTrigger('ext_env')">🌫️ Severe Weather<small>Low visibility hold · Med</small></button>
    <button class="s-btn" id="btn-ext_comm"   onclick="manualTrigger('ext_comm')">📵 Network Lost<small>Local safe mode · High</small></button>
    <button class="s-btn" id="btn-int_hw"     onclick="manualTrigger('int_hw')">🔧 Hardware Fault<small>Field rescue · High</small></button>
    <button class="s-btn" id="btn-int_percep" onclick="manualTrigger('int_percep')">👁️ Sensor Recalibrate<small>Auto-recovery · Low</small></button>
    <button class="s-btn" id="btn-int_algo"   onclick="manualTrigger('int_algo')">🧠 Decision Boundary<small>User input · High</small></button>
    <button class="s-btn" id="btn-safe_exit"  onclick="manualTrigger('safe_exit')">✅ Safe Exit<small>Support on-site · Low</small></button>
  </div>
</div>

<script>
const SK = "robotaxi_shared_state_en_v1";
const BK = "robotaxi_shared_bus_en_v1";
const CH = "robotaxi_hmi_sync_en_v1";
let bc; try { bc = new BroadcastChannel(CH); } catch(e){}

const BADGE = {
  reset:      { text: "🔄 Reset", risk: "med" },
  ext_signal: { text: "🚦 Signal Anomaly", risk: "med" },
  ext_env:    { text: "🌫️ Severe Weather", risk: "med" },
  ext_comm:   { text: "📵 Network Lost", risk: "high" },
  int_hw:     { text: "🔧 Hardware Fault", risk: "high" },
  int_percep: { text: "👁️ Sensor Recalibrate", risk: "low" },
  int_algo:   { text: "🧠 Decision Boundary", risk: "high" },
  safe_exit:  { text: "✅ Safe Exit", risk: "low" }
};
const KEYS = Object.keys(BADGE);

function $(id){ return document.getElementById(id); }

function notifyCabin(key){
  const state = { causeType: key, lastUpdate: Date.now() };
  const msg = { type: "state_update", src: "workspace", state, ts: Date.now() };
  try { localStorage.setItem(SK, JSON.stringify(state)); } catch(e){}
  try { localStorage.setItem(BK, JSON.stringify(msg)); } catch(e){}
  try { if(bc) bc.postMessage(msg); } catch(e){}
}

function fit(){
  const vp = $("cabinVP"), wrap = $("cabinWrap");
  if(!vp || !wrap) return;
  const s = Math.min(vp.clientWidth / 1280, vp.clientHeight / 720);
  const x = (vp.clientWidth - 1280 * s) / 2;
  const y = (vp.clientHeight - 720 * s) / 2;
  wrap.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
}
window.addEventListener("resize", ()=> requestAnimationFrame(fit));
requestAnimationFrame(fit);
setTimeout(fit, 120);

function setBadge(key){
  const meta = BADGE[key] || BADGE.reset;
  const b = $("scBadge");
  b.textContent = meta.text;
  b.className = "sc-badge risk-" + meta.risk;
}

function highlightBtn(key){
  document.querySelectorAll(".s-btn").forEach(btn => btn.classList.remove("active"));
  const el = $("btn-" + key);
  if(el){
    el.classList.add("active");
    el.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "nearest" });
  }
}

function manualTrigger(key){
  if(!KEYS.includes(key)) return;
  notifyCabin(key);
  highlightBtn(key);
  setBadge(key);
  const m = BADGE[key];
  if(m) $("deckSub").textContent = "Showing · "+m.text+(key!=="reset"?" · workflow opens":"");
}

window.addEventListener("load", ()=>{
  fit();
  $("deckSub").textContent = "Manual mode · choose a scenario below";
  notifyCabin("reset");
  highlightBtn("reset");
  setBadge("reset");
});
</script>
</body>
</html>
