<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Robotaxi Unexpected Failure Passenger Support HMI — interactive prototype showcase." />
  <title>Robotaxi HMI · Cover</title>
  <style>
    :root {
      --sky-0: #e8f2fc;
      --sky-1: #d4e8f8;
      --sky-2: #b8d9f2;
      --ink: #0f2538;
      --ink-soft: #3d5a73;
      --line: rgba(22, 104, 212, 0.14);
      --accent: #1568c7;
      --title-blue: #052e5c;
      --accent-soft: #e1eefb;
      --card: rgba(255, 255, 255, 0.72);
      --shadow: 0 20px 50px rgba(15, 37, 57, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(ellipse 120% 80% at 50% -20%, rgba(100, 180, 240, 0.35), transparent 55%),
        radial-gradient(ellipse 90% 60% at 100% 30%, rgba(130, 200, 235, 0.2), transparent 45%),
        radial-gradient(ellipse 70% 50% at 0% 80%, rgba(180, 220, 250, 0.35), transparent 50%),
        linear-gradient(165deg, var(--sky-0) 0%, var(--sky-1) 48%, #cfe6f8 100%);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    /* pic/bg — exported from pic/bg.pdf; barely visible wash */
    .cover-bg-photo {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 0;
      background: url("pic/bg.jpg") center / cover no-repeat;
      opacity: 0.08;
      filter: saturate(0.9);
    }

    .noise {
      pointer-events: none;
      position: fixed;
      inset: 0;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      z-index: 1;
    }

    /* ── Hero (first screen: title only) ── */
    .hero {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(24px, 6vw, 72px);
      text-align: center;
    }

    .hero-inner {
      max-width: 1040px;
      margin: 0 auto;
    }

    .eyebrow {
      display: inline-block;
      font-size: clamp(13px, 1.5vw, 17px);
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: clamp(24px, 4vw, 36px);
      padding-bottom: 4px;
      border-bottom: 1px solid var(--line);
    }

    .title {
      font-size: clamp(2.15rem, 5.8vw, 4.25rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.03em;
      color: var(--title-blue);
      text-wrap: balance;
    }

    .title span {
      display: inline;
    }

    .hint {
      margin-top: clamp(36px, 8vh, 72px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      font-size: clamp(13px, 1.6vw, 18px);
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-soft);
      opacity: 0.78;
      animation: fadeUp 1s ease 0.4s both;
    }

    .hint-bar {
      width: 1px;
      height: 36px;
      background: linear-gradient(to bottom, transparent, var(--accent), transparent);
      opacity: 0.45;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 0.75; transform: translateY(0); }
    }

    /* ── Actions (slightly below fold) ── */
    .band {
      position: relative;
      z-index: 2;
      padding: 0 clamp(20px, 5vw, 48px) clamp(56px, 10vh, 96px);
    }

    .band-inner {
      max-width: 800px;
      margin: 0 auto;
    }

    .band-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 22px;
      text-align: center;
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(14px, 3vw, 22px);
    }

    @media (max-width: 680px) {
      .cards { grid-template-columns: 1fr; }
    }

    .card-link {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      padding: clamp(22px, 4vw, 30px) clamp(22px, 4vw, 28px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      text-decoration: none;
      color: inherit;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .card-link:hover {
      transform: translateY(-3px);
      box-shadow: 0 24px 56px rgba(15, 37, 57, 0.12);
      border-color: rgba(22, 104, 212, 0.28);
    }

    .card-link:active {
      transform: translateY(-1px);
    }

    .card-icon {
      font-size: 22px;
      line-height: 1;
      opacity: 0.9;
    }

    .card-label {
      font-size: clamp(16px, 2.2vw, 18px);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .card-desc {
      font-size: 13px;
      line-height: 1.45;
      color: var(--ink-soft);
      font-weight: 500;
    }

    .card-go {
      margin-top: 4px;
      font-size: 12px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 0.02em;
    }

    footer {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 24px 16px 40px;
      font-size: 12px;
      color: var(--ink-soft);
      opacity: 0.55;
    }
  </style>
</head>
<body>
  <div class="cover-bg-photo" aria-hidden="true"></div>
  <div class="noise" aria-hidden="true"></div>

  <header class="hero">
    <div class="hero-inner">
      <p class="eyebrow">Interactive prototype</p>
      <h1 class="title">Robotaxi Unexpected Failure Passenger Support HMI System</h1>
      <div class="hint" aria-hidden="true">
        <div class="hint-bar"></div>
        <span>Scroll</span>
      </div>
    </div>
  </header>

  <section class="band" id="demos">
    <div class="band-inner">
      <p class="band-title">Showcase</p>
      <div class="cards">
        <a class="card-link" href="demo_carin.html">
          <span class="card-icon" aria-hidden="true">🖥</span>
          <span class="card-label">Vehicle End Showcase</span>
          <span class="card-desc">In-cabin safety display &amp; scenario workflows · 1280×720</span>
          <span class="card-go">Open →</span>
        </a>
        <a class="card-link" href="demo_mobile.html">
          <span class="card-icon" aria-hidden="true">📱</span>
          <span class="card-label">Mobile End Showcase</span>
          <span class="card-desc">Passenger app experience · phone frame preview</span>
          <span class="card-go">Open →</span>
        </a>
      </div>
    </div>
  </section>

  <footer>HMI prototype · light theme</footer>
</body>
</html>
